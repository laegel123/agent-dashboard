<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Claude Agents · Dashboard explorations</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Geist', -apple-system, system-ui, sans-serif; }
  /* Lock the artboard contents to the warm font stack even though design-canvas
     injects a fallback font-family on the host. */
  .dash, .dash * { font-family: var(--sans); }
  .dash .mono { font-family: var(--mono); }
  .dash .serif { font-family: var(--serif); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="mock-data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variant-warm.jsx"></script>
<script type="text/babel" src="variant-atelier.jsx"></script>
<script type="text/babel" src="variant-ops.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 1440, H = 900;
  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="dashboards"
          title="Claude Agents · Dashboard"
          subtitle="Three directions for the same data — pick a tone, then we build it out interactively."
        >
          <DCArtboard id="warm"    label="A · Warm Studio — Claude brand baseline" width={W} height={H}>
            <WarmStudio />
          </DCArtboard>
          <DCArtboard id="atelier" label="B · Atelier — editorial, more personality" width={W} height={H}>
            <Atelier />
          </DCArtboard>
          <DCArtboard id="ops"     label="C · Operations — dense console, dark, dev-tool" width={W} height={H}>
            <Operations />
          </DCArtboard>
        </DCSection>

        <DCPostIt top={460} left={40} rotate={-3} width={200}>
          Pick a direction and we'll flesh it out — interactions, tweaks, modal flows.
        </DCPostIt>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
