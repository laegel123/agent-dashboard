<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Claude Agents · Dashboard</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg); font-family: 'Geist', -apple-system, system-ui, sans-serif; color: var(--ink); }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 3px var(--running-bg); }
    50%      { box-shadow: 0 0 0 5px var(--running-bg); }
  }
  @keyframes fade-in    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-in   { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes scale-in   { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Buttons get a subtle press */
  button:active { transform: translateY(0.5px); }

  /* Smoother scrollbars in the warm theme */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--ink-5); border: 2px solid transparent; background-clip: content-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="mock-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="dashboard-utils.jsx"></script>
<script type="text/babel" src="dashboard-card.jsx"></script>
<script type="text/babel" src="dashboard-sidebar.jsx"></script>
<script type="text/babel" src="dashboard-detail.jsx"></script>
<script type="text/babel" src="dashboard-modals.jsx"></script>
<script type="text/babel" src="dashboard-app.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
